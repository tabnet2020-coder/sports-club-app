<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لا يوجد اتصال بالإنترنت - نادي اللياقة الذكي</title>
  <style>
    body {
      margin: 0;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #f0fdfa 0%, #ecfeff 100%);
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .box {
      background: #ffffff;
      padding: 34px 26px;
      border-radius: 20px;
      box-shadow: 0 14px 36px rgba(15, 118, 110, 0.14);
      max-width: 420px;
      width: 100%;
    }
    .ico { font-size: 2.6rem; margin-bottom: 10px; }
    h1 { color: #0f766e; margin: 0 0 10px; font-size: 1.4rem; }
    p { color: #475569; margin: 0 0 22px; line-height: 1.7; font-size: 0.95rem; }
    button {
      background: #0f766e;
      color: #ffffff;
      border: none;
      padding: 11px 24px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #115e59; }
  </style>
</head>
<body>
  <div class="box">
    <div class="ico">📡</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>يبدو أن جهازك غير متصل بالشبكة حالياً. تأكد من اتصالك بالإنترنت ثم أعد المحاولة.</p>
    <button onclick="window.location.reload()">🔄 إعادة المحاولة</button>
  </div>
</body>
</html>
